[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps = 
	m5stack/M5Atom@^0.1.2
	https://github.com/Industrial-Shields/arduino-Modbus.git
	fastled/FastLED@^3.6.0
	https://github.com/m5stack/M5Unit-ExtEncoder.git
	robtillaart/TCA9548@^0.3.0
	https://github.com/m5stack/ArduinoModbus.git
	https://github.com/m5stack/ArduinoRS485.git
	m5stack/ATOM_DTU_NB@^0.0.2
