[env:m5stack-atom]
platform = espressif32@~5.0.0
board = m5stack-atom
framework = arduino
lib_deps = 
	m5stack/M5Atom@^0.1.2
	https://github.com/m5stack/M5Unit-ExtEncoder.git
	robtillaart/TCA9548@^0.3.0
	robtillaart/RunningMedian@^0.3.9
	jonniezg/EWMA@^1.0.2
;	https://github.com/Larry70455/DFRobot_GP8302.git
    https://github.com/DFRobot/DFRobot_GP8302.git
	https://github.com/Industrial-Shields/arduino-Modbus.git
	fastled/FastLED@^3.10.3
monitor_speed = 19200
